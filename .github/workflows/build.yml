name: Build & Release

# What triggers this workflow
on:
  push:          # Runs on every normal commit and every tag push
  pull_request:  # Runs whenever a pull request is opened or updated

permissions:
  contents: write   # Gives permission to create GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 💡 This runs on every push and PR to make sure your code builds without errors during development!
      - name: Build with Gradle
        run: ./gradlew build

      # 🔽 [Runs only on Tag Push] Creates a new GitHub Release with the built JAR files
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true

      # 🔽 [Runs only on Tag Push] Uploads the built JAR files straight to Modrinth
      # Quick checklist before running:
      # 1. Make sure your project is already set up on Modrinth (you'll need the 'modrinth-id').
      # 2. Check your Modrinth PAT! It needs 3 permissions: 'Create versions', 'Read versions', and 'Write versions'.
      - name: Upload to Modrinth
        if: startsWith(github.ref, 'refs/tags/')
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: vRHoA9AL
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/*.jar
          name: Exile Respawn ${{ github.ref_name }}
          version: ${{ github.ref_name }}
